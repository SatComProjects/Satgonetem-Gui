<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SatGoNetem Web Control</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/queue.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>

  <header class="site-header">
    <span class="site-title">SatGoNetem</span>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/world">World View</a>
      <a href="/nodes">Nodes</a>
      <a href="/traffic">Traffic</a>
      <a href="/new_project">New Project</a>
      <a href="#" id="loadProjectLink">Load Project</a>
      <a href="#" id="saveProjectLink">Save Project</a>
      <a href="/docs" target="_blank">Docs</a>
    </nav>
    <input type="file" id="loadProjectInput" accept=".json" style="display:none">
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <small>SatGoNetem Web Control</small>
  </footer>

<script type="module" src="/static/project_actions.js?v=1"></script>

<!-- Floating Job Queue -->
<div id="floating-queue" class="floating-queue collapsed">
  <div class="card">
    <div class="floating-queue-header" id="jq-toggle">
      <span class="card-title">Job Queue <span id="jq-badge" class="jq-badge">0</span></span>
      <span id="jq-toggle-icon" class="jq-toggle-icon">&#9650;</span>
    </div>
    <div class="floating-queue-body">
      <div class="queue-actions">
        <button type="button" class="button small" id="jq-start-all">Start All</button>
        <button type="button" class="button small secondary" id="jq-clear">Clear</button>
      </div>
      <div id="job-queue-list" class="queue-list">
        <div class="muted">No jobs queued.</div>
      </div>
    </div>
  </div>
</div>

<!-- Results Modal -->
<div id="results-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <div class="modal-header">
      <span id="results-title">Traffic Results</span>
      <div class="spacer"></div>
      <button type="button" class="button small" id="results-close">Close</button>
    </div>
    <div id="results-body" class="results-body">
      <div class="muted">Loading results...</div>
    </div>
  </div>
  <div class="modal-backdrop" id="results-backdrop"></div>
</div>

<script type="module" src="/static/queue.js?v=4"></script>
</body>
</html>
