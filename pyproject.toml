[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satgonetem-gui"
version = "0.1.0"
description = "Web-based GUI control panel for the SatGoNetem satellite constellation network emulation framework."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "satgonetem>=0.1.0",
    "uvicorn[standard]>=0.29.0",
]

[tool.setuptools.packages.find]
include = ["satgonetem_gui*"]

[tool.setuptools.package-data]
satgonetem_gui = ["static/**/*", "templates/**/*"]

[tool.uv.sources]
satgonetem = { git = "https://github.com/satcomprojects/satgonetem" }
